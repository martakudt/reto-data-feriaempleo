<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin · Reto Data</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Nunito+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: var(--sp-6); }
    .admin-table th, .admin-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
    .admin-table th { color: var(--q-purple-mid); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .admin-table a { color: var(--q-lime); }
    .table-wrap { overflow-x: auto; }
    .filters { display: flex; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-6); }
    .filters .form-input { width: auto; min-width: 220px; }
  </style>
</head>
<body>
  <main class="screen">
    <div class="wrap" style="max-width: 980px">
      <div class="logo" style="margin-bottom: 24px">QUANT<span>IA</span></div>
      <p class="sec-label">Admin</p>
      <h2 class="sec-title">Contactos del <span>reto</span></h2>

      <form class="form" id="login-form" style="max-width: 400px">
        <div class="form-group">
          <label class="form-label" for="a-email">Email</label>
          <input class="form-input" id="a-email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="a-pass">Contraseña</label>
          <input class="form-input" id="a-pass" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="a-error"></p>
        <button class="btn btn-accent btn-lg" type="submit">Entrar</button>
      </form>

      <div id="panel" hidden>
        <p class="sec-desc" id="a-count"></p>
        <div class="filters">
          <select class="form-input" id="flt-interest" onchange="render()"><option value="">Todos los intereses</option></select>
          <select class="form-input" id="flt-status" onchange="render()"><option value="">Todas las situaciones</option></select>
        </div>
        <div class="actions" style="margin-top: 16px">
          <button class="btn btn-accent" onclick="downloadCsv()">Descargar CSV</button>
          <button class="btn btn-outline-light" onclick="firebase.auth().signOut()">Salir</button>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>#</th><th>Nombre</th><th>Email</th><th>LinkedIn</th><th>Interés</th><th>Situación</th><th>Puntos</th><th>Aciertos</th><th>SQL</th><th>ML</th><th>Py</th><th>Tiempo</th><th>Fecha</th></tr></thead>
            <tbody id="a-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="./config.js?v=5"></script>
  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtTime = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    const fmtDate = ts => ts && ts.toDate ? ts.toDate().toLocaleString('es-ES') : '';
    let rows = [];

    [['flt-interest', INTERESTS], ['flt-status', STATUSES]].forEach(([id, list]) => {
      $(id).insertAdjacentHTML('beforeend', list.map(v => `<option>${esc(v)}</option>`).join(''));
    });

    // Filas que pasan los filtros (también es lo que se descarga en el CSV)
    function filtered() {
      const i = $('flt-interest').value, s = $('flt-status').value;
      return rows.filter(r => (!i || r.interest === i) && (!s || r.status === s));
    }

    if (!firebaseConfig.apiKey) {
      $('a-error').textContent = 'Falta rellenar firebaseConfig en config.js.';
    } else {
      firebase.initializeApp(firebaseConfig);
      firebase.auth().onAuthStateChanged(async user => {
        $('login-form').hidden = !!user;
        $('panel').hidden = !user;
        if (!user) return;
        try {
          const snap = await firebase.firestore().collection('contacts').get();
          rows = snap.docs.map(d => d.data())
            .sort((a, b) => b.score - a.score || a.timeMs - b.timeMs);
          render();
        } catch (err) {
          $('a-count').textContent = 'Sin permiso para leer los contactos. ¿Está tu UID en ADMIN_UID y en firestore.rules?';
        }
      });
    }

    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      try {
        await firebase.auth().signInWithEmailAndPassword($('a-email').value.trim(), $('a-pass').value);
      } catch (err) {
        $('a-error').textContent = 'Email o contraseña incorrectos.';
      }
    });

    function render() {
      const list = filtered();
      $('a-count').textContent = list.length === rows.length
        ? `${rows.length} participantes`
        : `${list.length} de ${rows.length} participantes`;
      $('a-rows').innerHTML = list.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(r.name)}</td>
          <td>${esc(r.email)}</td>
          <td>${r.linkedin ? `<a href="${esc(r.linkedin)}" target="_blank" rel="noopener">perfil</a>` : ''}</td>
          <td>${esc(r.interest)}</td>
          <td>${esc(r.status)}</td>
          <td>${r.score}</td>
          <td>${r.correct}</td>
          <td>${r.sql ?? ''}</td>
          <td>${r.ml ?? ''}</td>
          <td>${r.python ?? ''}</td>
          <td>${fmtTime(r.timeMs)}</td>
          <td>${esc(fmtDate(r.createdAt))}</td>
        </tr>`).join('');
    }

    function downloadCsv() {
      const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [['posicion', 'nombre', 'email', 'linkedin', 'interes', 'situacion', 'puntos', 'aciertos', 'sql', 'ml', 'python', 'tiempo_s', 'fecha']]
        .concat(filtered().map((r, i) => [i + 1, r.name, r.email, r.linkedin, r.interest, r.status, r.score, r.correct, r.sql, r.ml, r.python, Math.round(r.timeMs / 1000), fmtDate(r.createdAt)]));
      // BOM para que Excel abra bien las tildes
      const blob = new Blob(['﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'reto-data-edem.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
